services:
  web:
    build:
      target: prod
    container_name: nuxt4-prod
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NUXT_TELEMETRY_DISABLED: "1"
      HOST: "0.0.0.0"
      PORT: "3000"
    restart: unless-stopped
  storybook:
    build:
      context: .
      dockerfile: Dockerfile
      target: storybook-prod
    container_name: storybook-prod
    ports:
      - "6006:80"
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
