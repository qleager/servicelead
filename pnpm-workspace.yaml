# Общее хранилище для macOS и bind-mounted Docker-контейнера.
storeDir: node_modules/.pnpm-store
verifyDepsBeforeRun: false

supportedArchitectures:
  os:
    - current
    - darwin
    - linux
  cpu:
    - current
    - arm64
  libc:
    - musl

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: true
  better-sqlite3: true
