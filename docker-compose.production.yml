services:
  web:
    build:
      target: production
    container_name: nuxt
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  caddy:
    image: caddy:2.10.2-alpine
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
  
  storybook:
    build: 
      target: storybook
    container_name: storybook
    expose:
      - 6006
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
