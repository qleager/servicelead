name: Deploy

on:
  push:
    branches:
      - main
      - staging

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  deploy:
    name: Deploy ${{ github.ref_name }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set deployment variables
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.HOST }}
          SERVER_USER: ${{ secrets.USER }}
          SERVER_APP_PATH: ${{ github.ref_name == 'main' && secrets.PRODUCTION_APP_PATH || secrets.STAGING_APP_PATH }}
          SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
        run: |
          set -euo pipefail

          IMAGE_NAME="${REGISTRY}/${GITHUB_REPOSITORY,,}"

          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            DEPLOY_ENV="production"
            APP_PORT="3000"
          else
            DEPLOY_ENV="staging"
            APP_PORT="3001"
          fi

          [[ -n "${SERVER_HOST}" ]] || { echo "::error::GitHub Secret HOST is empty"; exit 1; }
          [[ -n "${SERVER_USER}" ]] || { echo "::error::GitHub Secret USER is empty"; exit 1; }
          [[ -n "${SERVER_APP_PATH}" ]] || { echo "::error::GitHub Secret for the deploy path is empty"; exit 1; }
          [[ -n "${SSH_PASSPHRASE}" ]] || { echo "::error::GitHub Secret SSH_PASSPHRASE is empty, but SSH_KEY is passphrase protected"; exit 1; }

          {
            echo "IMAGE_NAME=${IMAGE_NAME}"
            echo "DEPLOY_ENV=${DEPLOY_ENV}"
            echo "APP_PORT=${APP_PORT}"
            echo "SERVER_APP_PATH=${SERVER_APP_PATH}"
          } >> "${GITHUB_ENV}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Nuxt image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.DEPLOY_ENV }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy image to server
        uses: appleboy/ssh-action@v1
        env:
          APP_PORT: ${{ env.APP_PORT }}
          DEPLOY_ENV: ${{ env.DEPLOY_ENV }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          SERVER_APP_PATH: ${{ env.SERVER_APP_PATH }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          envs: APP_PORT,DEPLOY_ENV,GHCR_TOKEN,GHCR_USER,IMAGE_REF,SERVER_APP_PATH
          command_timeout: 10m
          script: |
            set -eu

            mkdir -p "${SERVER_APP_PATH}"
            cd "${SERVER_APP_PATH}"

            printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

            cat > .github-deploy.compose.yml <<EOF
            name: servicelead-${DEPLOY_ENV}

            services:
              web:
                image: ${IMAGE_REF}
                container_name: servicelead-${DEPLOY_ENV}
                ports:
                  - "${APP_PORT}:3000"
                restart: unless-stopped
                healthcheck:
                  test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
                  interval: 10s
                  timeout: 5s
                  retries: 5
                  start_period: 20s
            EOF

            docker compose -f .github-deploy.compose.yml pull
            docker compose -f .github-deploy.compose.yml up -d --wait --wait-timeout 90
            docker image prune -f
