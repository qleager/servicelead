services:
  web:
    build:
      target: dev
    container_name: nuxt4-dev
    ports:
      - "3000:3000"
      - "24678:24678"
    environment:
      NODE_ENV: development
      HOST: "0.0.0.0"
      PORT: "3000"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - pnpm_store:/pnpm-store
      - nuxt_build:/app/.nuxt
    init: true
    command: ["sleep", "infinity"]

  storybook:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: storybook
    working_dir: /app
    ports:
      - "6006:6006"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: ["pnpm", "storybook"]

volumes:
  node_modules:
  nuxt_build:
  pnpm_store:
