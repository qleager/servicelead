services:
  # контейнер
  web:
    # берет ./DockerFile и собирвет образ
    build: .
    container_name: nuxt4-dev
    ports:
      - "3000:3000"     # Nuxt dev
      - "24678:24678"   # Vite HMR (чтобы работал hot reload через Docker)
    environment:
      NODE_ENV: development
      NUXT_TELEMETRY_DISABLED: "1"
      # Nuxt слушает все интерфейсы (иначе с хоста не достучаться)
      HOST: "0.0.0.0"
      # На Windows/Mac (Docker Desktop) бывает нужен polling для отслеживания файлов:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      # Монтируем код из хоста -> горячая перезагрузка
      # .: означает текущую папку в которой запущена команда docker compose up
      # это типа связь между реальной папкой на компе и папкой внутри контейнера
      - .:/app
      # Защищаем node_modules(ссылки на пакеты при pnpm) от перетирания bind-монтом (данные из образа
      # будут скопированы в том при первом запуске)
      # тут уже создаем volume(том), это хранилище внутри докер
      - node_modules:/app/node_modules
      ## Сами пакеты защищаем от перетирания и от вотчеров (пакеты создают для них шум),
      ## потому храним вне app. Еще подробности в .npmrc
      - pnpm_store:/pnpm-store
      # Кэшируем .nuxt (быстрее перезапуски)
      # тоже самое, это хранилище внутри докер
      - nuxt_build:/app/.nuxt
      
    #command: pnpm dev --host 0.0.0.0 --port 3000  # команда запуска Nuxt (закомментирована чтобы не запускать сразу)
    init: true                       # аккуратная обработка сигналов которая позволяет корректно завершать процессы внутри контейнера. опционально, но полезно для уборки зомби-процессов
    command: ["sleep", "infinity"]   # простая держалка контейнера чтобы потом зайти внутрь и запустить dev. держим контейнер живым, без автозапуска Nuxt
  
  storybook:
    build: .
    container_name: storybook
    working_dir: /app
    ports:
      - "6006:6006"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules

# декарируем именовынные тома
volumes:
  node_modules:
  nuxt_build:
  pnpm_store: