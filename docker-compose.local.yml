services:
  web:
    build:
      target: local
    container_name: nuxt
    ports:
      - "3000:3000"
      - "24678:24678"
      - "6006:6006"
    volumes:
    - type: bind
      source: .
      target: /app
    - type: volume
      source: node_modules
      target: /app/node_modules
    - type: volume
      source: pnpm_store
    init: true
    command: ["sleep", "infinity"]

volumes:
  node_modules:
  pnpm_store:
